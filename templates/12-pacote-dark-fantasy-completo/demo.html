<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Dark Fantasy Stream Pack Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #121212;
            color: #e6e6e6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            border: 4px solid #333;
            background-color: #0f0f0f;
            overflow: hidden;
        }
        
        /* Stream Scene Elements */
        .stream-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            z-index: -1;
        }
        
        .scene-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(135deg, #1a0e2f, #341d4b);
            z-index: -2;
        }
        
        .scene-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
            z-index: -1;
        }
        
        /* Stream Elements */
        .stream-elements {
            position: absolute;
            top: 50px;
            left: 50px;
            width: calc(100% - 100px);
            height: calc(100% - 100px);
            z-index: 1;
        }
        
        /* Stream Interface */
        .stream-interface {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 80px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 10;
        }
        
        .stream-interface button {
            background-color: #4a2f7b;
            color: white;
            border: none;
            padding: 8px 16px;
            cursor: pointer;
            font-weight: bold;
            text-transform: uppercase;
            border-radius: 5px;
        }
        
        .stream-interface button:hover {
            background-color: #3a206b;
        }
        
        /* Stream Alerts */
        .alerts-container {
            position: absolute;
            top: 10%;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 40px;
            z-index: 20;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .alert {
            position: absolute;
            padding: 10px 20px;
            border-radius: 5px;
            background-color: #3a206b;
            color: white;
            font-weight: bold;
            text-align: center;
            max-width: 80%;
            opacity: 0;
            transform: translateY(-40px);
            transition: all 0.5s ease-out;
        }
        
        .alert.show {
            opacity: 1;
            transform: translateY(0);
        }
        
        /* Chat Box */
        .chat-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            width: 90%;
            height: 180px;
            border-top: 2px solid #4a2f7b;
            z-index: 30;
        }
        
        .chat-header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            font-weight: bold;
        }
        
        .chat-messages {
            position: absolute;
            top: 30px;
            left: 0;
            width: 100%;
            height: calc(100% - 30px);
            overflow-y: auto;
            padding: 0 20px;
            color: #e6e6e6;
        }
        
        .chat-message {
            position: relative;
            margin-bottom: 15px;
            padding: 8px 12px;
            border-radius: 5px;
            background-color: rgba(0, 0, 0, 0.3);
            max-width: 90%;
        }
        
        .chat-message span {
            font-weight: bold;
            color: #e6e6e6;
        }
        
        /* Stream Scene Elements */
        .scene-elements {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            width: 80%;
            height: 70%;
            z-index: 1;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .scene-elements img {
            max-width: 100%;
            max-height: 100%;
