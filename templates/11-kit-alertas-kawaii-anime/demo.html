<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kit Alertas Kawaii Anime - Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Helvetica Neue', Arial, sans-serif;
        }
        
        body {
            background-color: #121212;
            color: #f1f1f1;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            border: 1px solid #333;
            background-color: #1a1a1a;
            overflow: hidden;
        }
        
        /* Stream Scene Elements */
        .stream-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .stream-canvas {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #121212;
            z-index: -1;
        }
        
        /* Stream UI Elements */
        .stream-ui {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 20px;
            z-index: 100;
        }
        
        .stream-header {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 100;
        }
        
        .stream-header h1 {
            font-size: 36px;
            color: #ff9500;
            text-shadow: 0 0 10px rgba(255, 149, 0, 0.7);
            margin: 0;
            padding: 0;
        }
        
        .stream-header .user-info {
            display: flex;
            align-items: center;
        }
        
        .stream-header .user-info img {
            width: 50px;
            height: 50px;
            border-radius: 50%;
            object-fit: cover;
            margin-right: 10px;
        }
        
        /* Chat Area */
        .chat-area {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 300px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            overflow-y: auto;
            z-index: 50;
        }
        
        .chat-messages {
            padding: 10px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-message {
            background-color: #2a2a2a;
            border-left: 4px solid #ff9500;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            margin-bottom: 8px;
        }
        
        .chat-message strong {
            color: #ff9500;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        
        /* Alert Area */
        .alert-area {
            position: absolute;
            top: 20px;
            left: 20px;
            right: 20px;
            height: 150px;
            background-color: #1a1a1a;
            border-bottom: 1px solid #333;
            overflow-y: auto;
            z-index: 75;
        }
        
        .alert-messages {
            padding: 10px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        /* Alert Message */
        .alert-message {
            background-color: #2a2a2a;
            border-left: 4px solid #ff9500;
            padding: 8px 12px;
            border-radius: 6px;
            max-width: 80%;
            margin-bottom: 8px;
        }
        
        .alert-message strong {
            color: #ff9500;
            font-weight: bold;
            display: block;
            margin-bottom: 4px;
        }
        
        /* Stream Controls */
        .stream-controls {
            position: absolute;
            bottom: 20px;
            left: 20px;
            right: 20px;
            height: 80px;
            background-color: #1a1a1a;
            border-top: 1px solid #333;
            display: flex;
            justify-content: space-between;
            align-items: center;
            z-index: 50;
        }
        
        .stream-controls button {
            width: 200px;
            height: 60px;
            border: none;
            background-color: #ff9500;
            color: #1a1a1a;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            border-radius: 6px;
            transition: transform 0.2s, box-shadow 0.2s;
        }
        
        .stream-controls button:hover {
            transform: scale(1.05);
            box-shadow: 0 0 15px rgba(255, 149, 0, 0.7);
        }
        
        /* Stream Scene Elements */
        .scene-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;

        .scene-foreground {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.5);
            z-index: -2;
        }
        
        /* Stream Scene Elements */
        .scene-text {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff9500;
            font-size: 36px;
            text-shadow: 0 0 10px rgba(255, 149, 0, 0.7);
            z-index: 0;
        }

        .scene-text span {
            color: #ffffff;

            text-shadow: 0 0 10px rgba(255, 149, 0, 0.7);
        }
        
        /* Stream Scene Elements */
        .scene-border {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            border: 2px solid #ff9500;
            z-index: -3;
        }
        
        /* Stream Scene Elements */
        .scene-shadow {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            box-shadow: inset 0 0 50px rgba(255, 149, 0, 0.3);
            z-index: -4;
        }
        
        /* Stream Scene Elements */
        .scene-gradient {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #ff9500, #ff6b6b);
            opacity: 0.1;
            z-index: -5;
        }
        
        /* Stream Scene Elements */
        .scene-animation {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: radial-gradient(circle, rgba(255, 149, 0, 0.3), transparent);
            animation: glow 3s ease-in-out infinite alternate;
            z-index: -6;
        }
        
        @keyframes glow {
            from { opacity: 0; }
            to { opacity: 0.2; }
        }
        
        /* Stream Scene Elements */
        .scene-pulse {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            border-radius: 50%;
            background-color: #ff9500;
            opacity: 0.3;
            animation: pulse 2s ease-in-out infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: translate(-50%, -50%) scale(1); }
            to { transform: translate(-50%, -50%) scale(1.5); }
        }
