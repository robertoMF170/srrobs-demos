<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RETRO ARCADE - Steam Overlay Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background-color: #0a0a0a;
            color: #e6e6e6;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            border: 2px solid #333;
            background-color: #0a0a0a;
            overflow: hidden;
        }
        
        /* Header */
        .header {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 60px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 0 20px;
            z-index: 10;
        }
        
        .header h1 {
            font-size: 32px;
            color: #ff5555;
            text-shadow: 0 0 10px rgba(255, 85, 85, 0.7);
            letter-spacing: 2px;
            animation: pulse 2s infinite alternate;
        }
        
        .header .username {
            font-size: 36px;
            color: #ffcc00;
            text-shadow: 0 0 10px rgba(255, 204, 0, 0.7);
            letter-spacing: 2px;
            animation: pulse 2s infinite alternate;
        }
        
        /* Game Area */
        .game-area {
            position: absolute;
            top: 60px;
            left: 0;
            width: 100%;
            height: calc(100% - 60px);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 5;
        }
        
        .game-area canvas {
            border: 2px solid #333;
            background-color: #0a0a0a;
        }
        
        /* Chat Area */
        .chat-area {
            position: absolute;
            bottom: 60px;
            left: 0;
            width: 100%;
            height: 480px;
            border-top: 2px solid #333;
            overflow-y: auto;
            z-index: 5;
        }
        
        .chat-container {
            padding: 10px;
            height: 100%;
            display: flex;
            flex-direction: column;
            gap: 8px;
        }
        
        .chat-message {
            background-color: #1a1a1a;
            border-left: 4px solid #ff5555;
            padding: 8px;
            margin-bottom: 4px;
            max-width: 90%;
            color: #e6e6e6;
            animation: fadeIn 0.3s ease-in;
        }
        
        .chat-message span {
            font-weight: bold;
            color: #ffcc00;
        }
        
        /* Alerts */
        .alert-box {
            position: absolute;
            top: 150px;
            left: 50%;
            transform: translateX(-50%);
            width: 70%;
            max-width: 480px;
            height: auto;
            padding: 20px;
            background-color: rgba(0, 0, 0, 0.9);
            border: 3px solid #ffcc00;
            border-radius: 10px;
            z-index: 50;
            text-align: center;
            animation: slideIn 0.5s ease-out forwards;
        }
        
        .alert-box h2 {
            font-size: 28px;
            color: #ffcc00;
            margin-bottom: 10px;
            text-shadow: 0 0 5px rgba(255, 204, 0, 0.7);
        }
        
        .alert-box p {
            font-size: 18px;
            color: #e6e6e6;
            margin-bottom: 10px;
        }
        
        /* Buttons */
        .button-container {
            position: absolute;
            bottom: 20px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 30;
        }
        
        .btn {
            padding: 12px 40px;
            font-size: 24px;
            background-color: #ffcc00;
            color: #0a0a0a;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            text-transform: uppercase;
            transition: all 0.3s ease;
        }
        
        .btn:hover {
            background-color: #ff9900;
            transform: scale(1.05);
        }
        
        /* Decorations */

            position: absolute;
            width: 100%;
            height: 100%;
            z-index: 0;
            pointer-events: none;
        }
