<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Cyberpunk Steam Artwork Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Courier New', monospace;
        }
        
        body {
            background-color: #0a0a0a;
            color: #0f9e8d;
            overflow: hidden;
            width: 100vw;
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
        }
        
        .container {
            position: relative;
            width: 1920px;
            height: 1080px;
            border: 4px solid #333;
            overflow: hidden;
        }
        
        /* Background */
        .background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-image: 
                linear-gradient(45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(-45deg, #0a0a0a 25%, transparent 25%),
                linear-gradient(45deg, transparent 25%, #1e1e1e 25%),
                linear-gradient(-45deg, transparent 25%, #1e1e1e 25%);
            background-size: 50px 50px;
            z-index: -10;
        }
        
        /* Stream Interface */
        .stream-interface {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 20px;
            z-index: 10;
        }
        
        /* Stream Title */
        .stream-title {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 48px;
            text-align: center;
            color: #0f9e8d;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            z-index: 20;
        }
        
        /* Stream Status */
        .stream-status {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 36px;
            text-align: center;
            color: #ff4d4d;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            z-index: 20;
        }
        
        /* Chat Area */
        .chat-area {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 30vh;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding-left: 20px;
            z-index: 15;
        }
        
        .chat-header {
            font-size: 24px;
            color: #ff9e8d;
            text-shadow: 0 0 5px rgba(0, 0, 0, 0.7);
            padding-bottom: 10px;
            border-bottom: 1px solid #333;
        }
        
        .chat-messages {
            flex-grow: 1;
            overflow-y: auto;
            padding-right: 20px;
            display: flex;
            flex-direction: column;
        }
        
        .message {
            position: relative;
            margin-bottom: 15px;
            max-width: 80%;
            background-color: #1e1e1e;
            border-radius: 4px;
            padding: 10px;
            color: #0f9e8d;
            font-size: 16px;
            line-height: 1.5;
        }
        
        .message::before {
            content: attr(data-author);
            position: absolute;
            left: 0;
            top: 0;
            padding-right: 10px;
            color: #ff4d4d;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
        }
        
        /* Alerts */
        .alerts {
            position: absolute;
            bottom: 50px;
            left: 0;
            width: 100%;
            height: 30vh;
            display: flex;
            flex-direction: column-reverse;
            justify-content: space-between;
            padding-left: 20px;
            z-index: 25;
        }
        
        .alert {
            position: relative;
            margin-bottom: 15px;
            max-width: 80%;
            background-color: #1e1e1e;
            border-radius: 4px;
            padding: 10px;
            color: #ff9e8d;
            font-size: 20px;
            text-align: center;
            animation: pulse 3s ease-in-out;
        }
        
        @keyframes pulse {
            0% { transform: scale(1); opacity: 1; }
            50% { transform: scale(1.2); opacity: 0.5; }
            100% { transform: scale(1); opacity: 1; }
        }
        
        /* Buttons */
        .button-container {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 20px;
            z-index: 30;
        }
        
        .button {
            padding: 15px 40px;
            background-color: #ff4d4d;
            color: #0a0a0a;
            border: none;
            border-radius: 8px;
            font-size: 24px;
            cursor: pointer;
            text-transform: uppercase;
            letter-spacing: 1px;
        }
        
        .button:hover {
            background-color: #ff6b6b;
        }
        
        /* Warning Note */
        .warning-note {
            position: absolute;
            top: 50px;
            left: 50%;
            transform: translateX(-50%);
            font-size: 24px;
            text-align: center;
            color: #ff9e8d;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            z-index: 35;
        }
        
        /* Cyberpunk Effects */
        .cyberpunk-effects {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            pointer-events: none;
            z-index: -5;
        }
        
        .glitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: glitch 3s infinite alternate-reverse;
            opacity: 0;
        }
        
        @keyframes glitch {
            0% { transform: translateX(0) rotate(0deg); }
            100% { transform: translateX(5px) rotate(-2deg); }
        }
        
        /* Cyberpunk Text */
        .cyberpunk-text {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            font-size: 48px;
            color: #ff9e8d;
            text-shadow: 0 0 5px rgba(255, 255, 255, 0.3);
            animation: flicker 1s infinite alternate;
        }
        
        @keyframes flicker {
            0% { opacity: 0; }
            50% { opacity: 1; }
            100% { opacity: 0; }
        }
        
        /* Customizable Elements */
        .customizable {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            color: #ff9e8d;
            text-shadow: 0 0 10px rgba(0, 0, 0, 0.7);
            font-size: 24px;
            z-index: 40;
        }
        
        /* Stream Scene Buttons */
        .scene-buttons {
            position: absolute;
            bottom: 50px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            z-index: 30;
        }
        
        /* Follower/Sub/Donation Alerts */
        .alert-follower {
            background-color: #1e1e1e;
            color: #ff9e8d;
            border-left: 4px solid #0f9e8d;
        }
        
        .alert-sub {
            background-color: #1e1e1e;
            color: #ff9e8d;
            border-left: 4px solid #ff4d4d;
        }
        
        .alert-donation {
            background-color: #1e1e1e;
            color: #ff9e8d;
            border-left: 4px solid #0f9e8d;
        }
        
        /* Cyberpunk UI Elements */
        .cyberpunk-ui {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 100px;
            height: 100px;
            background-color: #ff4d4d;
            border-radius: 50%;
            animation: pulse 2s infinite alternate;
        }
        
        @keyframes pulse {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }
        
        /* Cyberpunk Text Animation */
        .cyberpunk-text-animation {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff9e8d;
            text-shadow: 0 0 10px rgba(255, 255, 255, 0.3);
            animation: glitch-text 3s infinite alternate-reverse;
        }
        
        @keyframes glitch-text {
            0% { transform: translateX(0) rotate(0deg); opacity: 1; }
            50% { transform: translateX(5px) rotate(-2deg); opacity: 0.7; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }
        
        /* Cyberpunk Background Animation */
        .cyberpunk-background {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, #0a0a0a, #1e1e1e);
            animation: scanlines 3s infinite alternate-reverse;
        }
        
        @keyframes scanlines {
            0% { transform: translateX(0); opacity: 0; }
            100% { transform: translateX(5px); opacity: 1; }
        }
        
        /* Cyberpunk Glitch Effect */
        .cyberpunk-glitch {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: linear-gradient(45deg, transparent, rgba(255, 255, 255, 0.1), transparent);
            animation: glitch-effect 3s infinite alternate-reverse;
        }
        
        @keyframes glitch-effect {
            0% { transform: translateX(0) rotate(0deg); opacity: 0; }
            50% { transform: translateX(5px) rotate(-2deg); opacity: 1; }
            100% { transform: translateX(0) rotate(0deg); opacity: 0; }
        }
        
        /* Cyberpunk Text Glitch */
        .cyberpunk-text-glitch {

            animation: glitch-text-effect 3s infinite alternate-reverse;
        }
        
        @keyframes glitch-text-effect {
            0% { transform: translateX(0) rotate(0deg); opacity: 1; }
            50% { transform: translateX(5px) rotate(-2deg); opacity: 0.7; }
            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }
        
        /* Cyberpunk Interface Elements */
        .cyberpunk-interface {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            width: 200px;
            height: 200px;
            background-color: #ff4d4d;
            border-radius: 50%;
            animation: pulse-interface 3s infinite alternate-reverse;
        }
        
        @keyframes pulse-interface {
            0% { transform: translate(-50%, -50%) scale(1); opacity: 0.3; }
            100% { transform: translate(-50%, -50%) scale(1.2); opacity: 1; }
        }
        
        /* Cyberpunk Text Effects */
        .cyberpunk-text-effects {

            left: 50%;
            transform: translate(-50%, -50%);
            font-size: 36px;
            color: #ff9e8d;

            animation: glitch-text-effects 3s infinite alternate-reverse;
        }

            100% { transform: translateX(0) rotate(0deg); opacity: 1; }
        }
