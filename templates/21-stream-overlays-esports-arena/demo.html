<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Esports Arena Stream Overlay Demo</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Arial', sans-serif;
        }
        
        body {
            background-color: #0e0e0e;
            color: #ffffff;
            overflow: hidden;
            height: 100vh;
            width: 100vw;
            position: relative;
        }
        
        .container {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: -1;
        }
        
        #stream-container {
            position: relative;
            width: 1920px;
            height: 1080px;
            border: 1px solid rgba(255,255,255,0.1);
            overflow: hidden;
        }
        
        .overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            z-index: 100;
            pointer-events: none;
        }
        
        /* Main Stream Area */
        #stream-area {
            position: absolute;
            top: 0;
            left: 0;
            width: 1920px;
            height: 1080px;
            background-color: rgba(0,0,0,0.7);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        
        #stream-area h1 {
            font-size: 4rem;
            text-align: center;
            color: #ff6b6b;
            text-shadow: 0px 0px 20px rgba(255,107,107,0.3);
            animation: pulse 2s infinite alternate;
        }
        
        @keyframes pulse {
            from { transform: scale(1); }
            to { transform: scale(1.05); }
        }
        
        /* Chat Box */
        #chat-container {
            position: absolute;
            bottom: 30px;
            left: 0;
            width: 1920px;
            height: 200px;
            background-color: rgba(0,0,0,0.5);
            border-top: 2px solid #ff6b6b;
            padding: 10px;
            z-index: 80;
        }
        
        .chat-messages {
            height: calc(100% - 40px);
            overflow-y: scroll;
            margin-bottom: 10px;
            color: white;
            font-size: 16px;
        }
        
        .chat-message {
            padding: 8px;
            border-radius: 5px;
            margin-bottom: 5px;
            max-width: 90%;
            background-color: rgba(255,255,255,0.1);
            animation: fadeIn 0.3s ease-in;
        }
        
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        #chat-input {
            width: 95%;
            padding: 8px;
            border: none;
            background-color: rgba(255,255,255,0.1);
            color: white;
            font-size: 16px;
            margin-left: 5px;
        }
        
        #chat-input::placeholder {
            color: rgba(255,255,255,0.7);
        }
        
        /* Alerts */
        .alert-box {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 10px 20px;
            border-radius: 8px;
            background-color: rgba(0,0,0,0.7);
            color: white;
            font-size: 16px;
            animation: slideIn 0.3s ease-out forwards, pulseAlert 0.5s ease-in;
        }
        
        @keyframes slideIn {
            from { transform: translateX(-50%) translateY(-20px); opacity: 0; }
            to { transform: translateX(-50%) translateY(0); opacity: 1; }
        }
        
        @keyframes pulseAlert {
            0%, 100% { box-shadow: 0 0 10px rgba(255,107,107,0.3); }
            50% { box-shadow: 0 0 20px rgba(255,107,107,0.6); }
        }
        
        /* Buttons */
        .button-container {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 90;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: #ff6b6b;
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .button:hover {
            transform: scale(1.1);
            box-shadow: 0 0 20px rgba(255,107,107,0.6);
        }
        
        /* Scene Buttons */
        #scene-buttons {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 95;
            display: flex;
            justify-content: center;
            gap: 20px;
        }
        
        .scene-button {
            padding: 15px 30px;
            font-size: 18px;
            background-color: rgba(255,107,107,0.2);
            color: white;
            border: none;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
        }
        
        .scene-button:hover {
            background-color: rgba(255,107,107,0.4);
        }
        
        /* Follower Alert */
        #follower-alert {
            position: absolute;
            top: 30px;
            left: 50%;
            transform: translateX(-50%);
            z-index: 100;
            padding: 10px 20px;

        .demo-note {
            position: absolute;
            top: 20px;
            left: 50%;
            transform: translateX(-50%);
            color: #ff6b6b;
            font-size: 18px;
            text-align: center;
            z-index: 99;
        }
        
        /* Stream Scene */
        .stream-scene {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            display: none;
            justify-content: center;
            align-items: center;
            z-index: 50;
        }
        
        .stream-scene.active {

        }
        
        /* Background Elements */
        .background-element {
            position: absolute;
            width: 100px;
            height: 100px;
            border-radius: 50%;
            opacity: 0.2;
            animation: float 8s ease-in-out infinite alternate;
        }
        
        @keyframes float {
            from { transform: translateY(0) translateX(0); }
            to { transform: translateY(-100px) translateX(100px); }
        }

        .customizable {

            font-weight: bold;
            text-decoration: underline;
        }

        /* Centered Content */
        .centered-content {
            position: absolute;
            top: 50%;
            left: 50%;
            transform: translate(-50%, -50%);
            z-index: 100;
        }
        
        #stream-title {

            margin-bottom: 20px;

            left: 50%;
